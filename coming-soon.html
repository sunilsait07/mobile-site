<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon — AutoDiag</title>
  <meta name="description" content="We're launching something exciting! Stay tuned for new features and services from AutoDiag.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/coming-soon.css">
</head>
<body>
  <div class="coming-soon-page">
    <div class="cs-particles">
      <div class="cs-particle"></div>
      <div class="cs-particle"></div>
      <div class="cs-particle"></div>
      <div class="cs-particle"></div>
    </div>

    <div class="cs-top-actions">
      <button class="nav-toggle-btn theme-toggle" aria-label="Toggle theme">
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
      <button class="nav-toggle-btn rtl-toggle" aria-label="Toggle RTL">
        <svg class="icon-exchange" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17H4M4 17l4 4M4 17l4-4M4 7h16M20 7l-4-4M20 7l-4 4" /></svg>
      </button>
    </div>

    <div class="cs-content">
      <a href="index.html" class="cs-logo">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" rx="8" fill="currentColor" style="color: var(--clr-primary)"/><path d="M8 18C8 12.477 12.477 8 18 8C23.523 8 28 12.477 28 18" stroke="white" stroke-width="2.5" stroke-linecap="round"/><path d="M12 18C12 14.686 14.686 12 18 12C21.314 12 24 14.686 24 18" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/><circle cx="18" cy="18" r="3" fill="#F97316"/><line x1="18" y1="21" x2="18" y2="28" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/><line x1="14" y1="26" x2="22" y2="26" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/></svg>
        <div class="cs-logo-text">Auto<span>Diag</span></div>
      </a>

      <h1>Something <span class="gradient-text">Amazing</span> is Coming</h1>
      <p class="cs-desc">We're working on exciting new diagnostic features and services. Be the first to know when we launch.</p>

      <div class="countdown">
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-days">30</div>
          <div class="countdown-label">Days</div>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-hours">00</div>
          <div class="countdown-label">Hours</div>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-mins">00</div>
          <div class="countdown-label">Minutes</div>
        </div>
        <div class="countdown-separator">:</div>
        <div class="countdown-item">
          <div class="countdown-value" id="countdown-secs">00</div>
          <div class="countdown-label">Seconds</div>
        </div>
      </div>

      <div class="cs-subscribe">
        <input type="email" placeholder="Enter your email for updates" id="cs-email">
        <button class="btn btn-primary" id="cs-notify">Notify Me</button>
      </div>

      <a href="index.html" class="cs-back-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Home
      </a>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/rtl.js"></script>
  <script src="js/coming-soon.js"></script>
</body>
</html>
